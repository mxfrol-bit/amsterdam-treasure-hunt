<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Amsterdam Treasure Hunt</title>
	
	<!-- Mapbox -->
	<link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
	<script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
	
	<!-- Telegram WebApp SDK -->
	<script src="https://telegram.org/js/telegram-web-app.js"></script>
	
	<!-- Supabase -->
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- Loading Screen -->
	<div id="loading-screen">
		<div class="loader"></div>
		<p>Finding treasures near you...</p>
	</div>

	<!-- Main App -->
	<div id="app" style="display: none;">
		<!-- Header -->
		<header>
			<div class="header-content">
				<h1>💎 Treasure Hunt</h1>
				<div class="user-info">
					<span id="username">Loading...</span>
					<span class="score">🏆 <span id="user-score">0</span></span>
				</div>
			</div>
		</header>

		<!-- Map Container -->
		<div id="map"></div>

		<!-- Bottom Panel -->
		<div id="bottom-panel">
			<div id="treasure-info" style="display: none;">
				<h3 id="treasure-name">Treasure Name</h3>
				<p id="treasure-description">Description</p>
				<div class="treasure-distance">
					<span id="distance-text">📍 Calculating distance...</span>
				</div>
				<button id="claim-btn" class="btn-primary" disabled>
					🔒 Too far away
				</button>
			</div>

			<div id="default-info">
				<h3>Welcome to Amsterdam!</h3>
				<p>Walk around the city to find hidden treasures. Tap on markers to see details.</p>
				<div class="stats">
					<div class="stat">
						<span class="stat-value" id="total-treasures">5</span>
						<span class="stat-label">Treasures</span>
					</div>
					<div class="stat">
						<span class="stat-value" id="claimed-count">0</span>
						<span class="stat-label">Found</span>
					</div>
					<div class="stat">
						<span class="stat-value" id="remaining-count">5</span>
						<span class="stat-label">Remaining</span>
					</div>
				</div>
			</div>
		</div>

		<!-- Success Modal -->
		<div id="success-modal" class="modal" style="display: none;">
			<div class="modal-content">
				<div class="modal-icon">🎉</div>
				<h2>Treasure Claimed!</h2>
				<p id="success-message">You earned <strong>10 points</strong>!</p>
				<button id="close-modal" class="btn-primary">Continue Hunting</button>
			</div>
		</div>
	</div>

	<script src="app.js"></script>
</body>
</html>
