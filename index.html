<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔮 Легенды Нижнего • Охота за сокровищами</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* ============================================ */
        /* 🎨 РЕВОЛЮЦИОННЫЙ ДИЗАЙН - БАЗОВЫЕ СТИЛИ */
        /* ============================================ */
        
        :root {
            /* Цветовая палитра - Неоморфизм + Глассморфизм */
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --bg-legendary: linear-gradient(135deg, #ffd700 0%, #ff6b6b 100%);
            --bg-mystic: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --bg-common: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
            
            /* Глассморфизм */
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            
            /* Неоморфизм */
            --neo-light: #ffffff;
            --neo-dark: rgba(0, 0, 0, 0.2);
            --neo-shadow-1: -5px -5px 10px rgba(255, 255, 255, 0.1);
            --neo-shadow-2: 5px 5px 10px rgba(0, 0, 0, 0.3);
            
            /* Текст */
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-accent: #667eea;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif;
            background: #0f0f23;
            color: var(--text-primary);
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        /* ============================================ */
        /* 🌌 АНИМИРОВАННЫЙ ФОН */
        /* ============================================ */
        
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -1;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Звёздное небо */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        /* ============================================ */
        /* 🗺️ КАРТА - УЛЬТРА СОВРЕМЕННЫЙ СТИЛЬ */
        /* ============================================ */
        
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }
        
        #map-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 0;
        }
        
        #map {
            width: 100%;
            height: 100%;
            filter: brightness(0.9) contrast(1.1) saturate(1.2);
        }
        
        /* Стильная рамка карты */
        #map::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(102, 126, 234, 0.2);
        }
        
        /* ============================================ */
        /* 💎 МАРКЕРЫ - 3D СТИЛЬ */
        /* ============================================ */
        
        .treasure-marker {
            width: 60px !important;
            height: 60px !important;
            margin: -30px 0 0 -30px !important;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: 50%;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 30px !important;
            box-shadow: var(--glass-shadow),
                        0 0 30px rgba(102, 126, 234, 0.6);
            animation: float 3s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
        }
        
        .treasure-marker::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: var(--bg-primary);
            border-radius: 50%;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s;
        }
        
        .treasure-marker:hover::before,
        .treasure-marker:active::before {
            opacity: 0.3;
            animation: ripple 1s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        
        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        
        /* Легендарные точки */
        .treasure-marker-legendary {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3) 0%, rgba(255, 107, 107, 0.3) 100%);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.8),
                        var(--glass-shadow);
            animation: float 3s ease-in-out infinite, glow-legendary 2s ease-in-out infinite;
        }
        
        @keyframes glow-legendary {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)); }
            50% { filter: drop-shadow(0 0 25px rgba(255, 215, 0, 1)); }
        }
        
        /* Мистические точки */
        .treasure-marker-mystic {
            background: linear-gradient(135deg, rgba(168, 237, 234, 0.3) 0%, rgba(254, 214, 227, 0.3) 100%);
            box-shadow: 0 0 40px rgba(168, 237, 234, 0.8),
                        var(--glass-shadow);
            animation: float 3s ease-in-out infinite, glow-mystic 2s ease-in-out infinite;
        }
        
        @keyframes glow-mystic {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(168, 237, 234, 0.8)); }
            50% { filter: drop-shadow(0 0 25px rgba(254, 214, 227, 1)); }
        }
        
        /* Найденные точки */
        .treasure-marker-claimed {
            opacity: 0.4;
            filter: grayscale(100%);
            animation: none !important;
            box-shadow: none;
        }
        
        /* Маркер игрока - Футуристичный */
        .player-marker {
            width: 40px !important;
            height: 40px !important;
            margin: -20px 0 0 -20px !important;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.8),
                        0 0 60px rgba(76, 175, 80, 0.4);
            animation: playerPulse 2s infinite;
            position: relative;
        }
        
        .player-marker::after {
            content: '📍';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
        }
        
        @keyframes playerPulse {
            0%, 100% {
                box-shadow: 0 0 30px rgba(76, 175, 80, 0.8),
                            0 0 60px rgba(76, 175, 80, 0.4);
            }
            50% {
                box-shadow: 0 0 40px rgba(76, 175, 80, 1),
                            0 0 80px rgba(76, 175, 80, 0.6);
            }
        }
        
        /* ============================================ */
        /* 🎯 ВЕРХНЯЯ ПАНЕЛЬ - ГЛАССМОРФИЗМ */
        /* ============================================ */
        
        #status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            padding: 20px 15px 15px 15px;
            z-index: 1000;
            box-shadow: var(--glass-shadow);
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .status-row:last-child {
            margin-bottom: 0;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        /* 3D Аватар */
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: var(--neo-shadow-1), var(--neo-shadow-2);
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .avatar::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .user-details {
            flex: 1;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 3px;
        }
        
        .user-stats {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            gap: 10px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Огненный бейдж стрика */
        .streak-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-secondary);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .streak-fire {
            animation: flicker 1.5s infinite;
            font-size: 20px;
        }
        
        @keyframes flicker {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }
        
        /* Прогресс-бар - Футуристичный */
        .progress-container {
            margin-top: 12px;
        }
        
        .progress-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .progress-fill {
            height: 100%;
            background: var(--bg-primary);
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: progressShine 2s infinite;
        }
        
        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        /* ============================================ */
        /* 🧭 КОМПАС - НЕВЕРОЯТНЫЙ ДИЗАЙН */
        /* ============================================ */
        
        .compass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
        }
        
        .compass-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: rotate 10s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .compass-info {
            flex: 1;
            z-index: 1;
        }
        
        .compass-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .compass-target {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .compass-distance {
            font-size: 32px;
            font-weight: 900;
            background: var(--bg-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* 3D Стрелка компаса */
        .compass-arrow {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5),
                        var(--neo-shadow-1), var(--neo-shadow-2);
            position: relative;
            z-index: 1;
        }
        
        .compass-arrow::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, transparent 100%);
        }
        
        /* ============================================ */
        /* 🎮 НИЖНЯЯ ПАНЕЛЬ - ИГРОВОЙ СТИЛЬ */
        /* ============================================ */
        
        #bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid var(--glass-border);
            padding: 15px;
            z-index: 1000;
            box-shadow: 0 -8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .nav-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        
        /* 3D Кнопки навигации */
        .nav-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px 10px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            box-shadow: var(--neo-shadow-1), var(--neo-shadow-2);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn-icon {
            font-size: 24px;
            position: relative;
            z-index: 1;
            transition: transform 0.3s;
        }
        
        .nav-btn span {
            position: relative;
            z-index: 1;
        }
        
        .nav-btn-active {
            background: var(--bg-primary);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.6);
            transform: translateY(-3px);
        }
        
        .nav-btn-active .nav-btn-icon {
            transform: scale(1.1);
            animation: bounce 0.5s;
        }
        
        @keyframes bounce {
            0%, 100% { transform: scale(1.1) translateY(0); }
            50% { transform: scale(1.1) translateY(-5px); }
        }
        
        /* ============================================ */
        /* 🎭 МОДАЛЬНЫЕ ОКНА - EPIC STYLE */
        /* ============================================ */
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10000;
            overflow-y: auto;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            margin: 20px;
            padding: 30px 25px;
            border-radius: 30px;
            position: relative;
            animation: slideUp 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        /* Кнопка закрытия */
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        
        .modal-close:active {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }
        
        .modal-header {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .modal-icon {
            font-size: 40px;
            animation: float 3s ease-in-out infinite;
        }
        
        /* Продолжение в следующем файле... */
    </style>
</head>
<body>
    <!-- Анимированный фон -->
    <div class="animated-bg"></div>
    <div class="stars" id="stars"></div>
    
    <!-- Загрузка -->
    <div id="loading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100000;">
        <div style="font-size: 80px; animation: float 3s ease-in-out infinite;">🔮</div>
        <div style="margin-top: 20px; font-size: 24px; font-weight: 700; color: #fff;">Загрузка магии...</div>
        <div style="margin-top: 30px; width: 200px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden;">
            <div style="width: 0%; height: 100%; background: white; animation: loading 2s infinite;"></div>
        </div>
    </div>
    
    <style>
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 100%; }
            100% { width: 0%; }
        }
    </style>
    
    <script>
        // Создаём звёзды
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
        
        console.log('🔮 Революционный дизайн загружен!');
    </script>
</body>
</html>
    
    <!-- Главное приложение -->
    <div id="app" style="display: none;">
        <!-- Карта -->
        <div id="map-container">
            <div id="map"></div>
        </div>
        
        <!-- Верхняя панель -->
        <div id="status-bar">
            <div class="status-row">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">👤</div>
                    <div class="user-details">
                        <div class="user-name" id="user-name">Загрузка...</div>
                        <div class="user-stats">
                            <div class="stat-item">
                                ⭐ <span id="user-score">0</span>
                            </div>
                            <div class="stat-item">
                                💎 <span id="user-found">0</span>/<span id="user-total">0</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="streak-badge">
                    <span class="streak-fire">🔥</span>
                    <span id="streak-days">0</span>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-label">
                    <span>✨ Прогресс квеста</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <!-- Нижняя панель -->
        <div id="bottom-panel">
            <!-- Компас -->
            <div class="compass-container" id="compass" style="display: none;">
                <div class="compass-info">
                    <div class="compass-title">🧭 Ближайшая цель</div>
                    <div class="compass-target">
                        <span id="compass-icon">💎</span>
                        <span id="compass-name">Загрузка...</span>
                    </div>
                    <div class="compass-distance" id="compass-distance">---м</div>
                </div>
                <div class="compass-arrow" id="compass-arrow">↑</div>
            </div>
            
            <!-- Навигация -->
            <div class="nav-buttons">
                <button class="nav-btn nav-btn-active" onclick="showMap()">
                    <span class="nav-btn-icon">🗺️</span>
                    <span>Карта</span>
                </button>
                <button class="nav-btn" onclick="showList()">
                    <span class="nav-btn-icon">📍</span>
                    <span>Точки</span>
                </button>
                <button class="nav-btn" onclick="showProfile()">
                    <span class="nav-btn-icon">👤</span>
                    <span>Профиль</span>
                </button>
                <button class="nav-btn" onclick="showLeaderboard()">
                    <span class="nav-btn-icon">🏆</span>
                    <span>Топ</span>
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Конфигурация с ПРАВИЛЬНЫМИ координатами
        const CONFIG = {
            SUPABASE_URL: 'https://otvtqoowhupqxushkmma.supabase.co',
            SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90dnRxb293aHVwcXh1c2hrbW1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzMTEyNzksImV4cCI6MjA3ODg4NzI3OX0.Q9yV-YW1ir9eOIH-eOKTnsbVH0CD2Eruw4eZ7YWajBM',
            CLAIM_DISTANCE: 50,
            MAP_CENTER: [56.3287, 44.002],
            MAP_ZOOM: 13
        };
        
        let supabase, map, playerMarker, playerPosition = null;
        let treasures = [], claimedTreasures = [], currentUser = null;
        let treasureMarkers = {};
        
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('🚀 Запуск революционного приложения!');
                
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                
                supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
                
                const telegramUser = tg.initDataUnsafe?.user;
                if (!telegramUser || !telegramUser.id) {
                    throw new Error('Откройте через Telegram!');
                }
                
                currentUser = await getOrCreateUser(telegramUser);
                await initMap();
                await loadTreasures();
                await loadClaimedTreasures();
                updateUI();
                startTracking();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                
                console.log('🎉 Приложение готово!');
                
            } catch (error) {
                console.error('💥 Ошибка:', error);
                alert('Ошибка: ' + error.message);
            }
        });
        
        async function getOrCreateUser(telegramUser) {
            let { data: user, error } = await supabase
                .from('users')
                .select('*')
                .eq('telegram_id', telegramUser.id)
                .single();
            
            if (error && error.code === 'PGRST116') {
                const { data: newUser, error: createError } = await supabase
                    .from('users')
                    .insert([{
                        telegram_id: telegramUser.id,
                        username: telegramUser.username || `user${telegramUser.id}`,
                        first_name: telegramUser.first_name,
                        score: 0
                    }])
                    .select()
                    .single();
                
                if (createError) throw createError;
                user = newUser;
            }
            
            return user;
        }
        
        async function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView(CONFIG.MAP_CENTER, CONFIG.MAP_ZOOM);
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                minZoom: 10
            }).addTo(map);
            
            const playerIcon = L.divIcon({
                className: 'player-marker',
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });
            
            playerMarker = L.marker(CONFIG.MAP_CENTER, { icon: playerIcon }).addTo(map);
            
            setTimeout(() => map.invalidateSize(true), 100);
        }
        
        async function loadTreasures() {
            const { data, error } = await supabase
                .from('treasures')
                .select('*')
                .eq('active', true);
            
            if (error) throw error;
            
            treasures = data || [];
            
            treasures.forEach(treasure => {
                addTreasureMarker(treasure);
            });
        }
        
        function addTreasureMarker(treasure) {
            if (!treasure || !treasure.lat || !treasure.lng) return;
            
            const isClaimed = claimedTreasures.some(c => c.treasure_id === treasure.id);
            const rarity = treasure.rarity || 'common';
            
            let markerClass = 'treasure-marker';
            if (rarity === 'legendary') markerClass += ' treasure-marker-legendary';
            if (rarity === 'mystic') markerClass += ' treasure-marker-mystic';
            if (isClaimed) markerClass += ' treasure-marker-claimed';
            
            const icon = L.divIcon({
                className: markerClass,
                html: treasure.icon || '💎',
                iconSize: [60, 60],
                iconAnchor: [30, 30]
            });
            
            const marker = L.marker([treasure.lat, treasure.lng], {
                icon,
                riseOnHover: true
            })
                .addTo(map)
                .on('click', () => {
                    console.log('🖱️ Клик:', treasure.name);
                    alert(`${treasure.icon} ${treasure.name}\n${treasure.points} очков`);
                });
            
            treasureMarkers[treasure.id] = marker;
        }
        
        async function loadClaimedTreasures() {
            const { data, error } = await supabase
                .from('claims')
                .select('*')
                .eq('user_id', currentUser.id);
            
            if (error) return;
            claimedTreasures = data || [];
        }
        
        function startTracking() {
            if (!navigator.geolocation) return;
            
            navigator.geolocation.watchPosition(
                (position) => {
                    playerPosition = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    playerMarker.setLatLng([playerPosition.lat, playerPosition.lng]);
                    updateDistances();
                },
                (error) => console.log('Геолокация:', error),
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }
        
        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lng2 - lng1) * Math.PI / 180;
            
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            
            return R * c;
        }
        
        function formatDistance(meters) {
            if (meters < 1000) return Math.round(meters) + 'м';
            return (meters / 1000).toFixed(1) + 'км';
        }
        
        function updateDistances() {
            if (!playerPosition) return;
            
            treasures.forEach(treasure => {
                treasure.distance = calculateDistance(
                    playerPosition.lat,
                    playerPosition.lng,
                    treasure.lat,
                    treasure.lng
                );
            });
            
            treasures.sort((a, b) => a.distance - b.distance);
            updateCompass();
        }
        
        function updateCompass() {
            if (!playerPosition || treasures.length === 0) return;
            
            const nearest = treasures.find(t => 
                !claimedTreasures.some(c => c.treasure_id === t.id)
            );
            
            if (!nearest) {
                document.getElementById('compass').style.display = 'none';
                return;
            }
            
            document.getElementById('compass').style.display = 'flex';
            document.getElementById('compass-icon').textContent = nearest.icon || '💎';
            document.getElementById('compass-name').textContent = nearest.name;
            document.getElementById('compass-distance').textContent = formatDistance(nearest.distance);
        }
        
        function updateUI() {
            const username = currentUser.username || currentUser.first_name || 'Охотник';
            document.getElementById('user-name').textContent = username;
            document.getElementById('user-avatar').textContent = username[0].toUpperCase();
            document.getElementById('user-score').textContent = currentUser.score;
            document.getElementById('user-found').textContent = claimedTreasures.length;
            document.getElementById('user-total').textContent = treasures.length;
            
            const progress = treasures.length > 0 
                ? Math.round((claimedTreasures.length / treasures.length) * 100)
                : 0;
            document.getElementById('progress-percent').textContent = progress + '%';
            document.getElementById('progress-fill').style.width = progress + '%';
        }
        
        function showMap() {
            updateNavButtons('map');
        }
        
        function showList() {
            alert('📍 Список точек - в разработке!');
            updateNavButtons('list');
        }
        
        function showProfile() {
            alert('👤 Профиль - в разработке!');
            updateNavButtons('profile');
        }
        
        function showLeaderboard() {
            alert('🏆 Рейтинг - в разработке!');
            updateNavButtons('leaderboard');
        }
        
        function updateNavButtons(active) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('nav-btn-active');
            });
            
            const buttons = { 'map': 0, 'list': 1, 'profile': 2, 'leaderboard': 3 };
            const index = buttons[active];
            if (index !== undefined) {
                document.querySelectorAll('.nav-btn')[index].classList.add('nav-btn-active');
            }
        }
    </script>
</body>
</html>
