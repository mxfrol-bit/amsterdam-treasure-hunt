<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Охота за сокровищами • Нижний Новгород</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Leaflet для карты -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --bg-main: #05070c;
            --bg-elevated: rgba(9, 11, 20, 0.96);
            --bg-elevated-soft: rgba(12, 15, 28, 0.92);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-main: #e5e7eb;
            --text-subtle: rgba(229, 231, 235, 0.65);
            --accent: #4fd1c5;
            --accent-soft: rgba(79, 209, 197, 0.12);
            --accent-strong: #63b3ed;
            --danger: #f56565;
            --success: #48bb78;
            --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.65);
            --radius-lg: 18px;
            --radius-xl: 24px;
            --blur-glass: 18px;
            --transition-fast: 0.18s ease-out;
            --transition-med: 0.25s ease-out;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top, #111827 0, #020308 45%, #000 100%);
            color: var(--text-main);
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        /* ============================================ */
        /* DEBUG ПАНЕЛЬ — НУАР-КОНСОЛЬ                  */
        /* ============================================ */
        
        #debug-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 32vh;
            background: radial-gradient(circle at top left, #0b1120, #020308);
            color: #9ae6b4;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 10px;
            overflow-y: auto;
            z-index: 999999;
            border-top: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 14px 14px 0 0;
            padding: 8px 10px;
            box-shadow: 0 -14px 30px rgba(0, 0, 0, 0.7);
            display: block;
        }
        
        #debug-panel.hidden {
            display: none;
        }
        
        .debug-line {
            margin-bottom: 2px;
            word-wrap: break-word;
            opacity: 0.85;
        }
        
        .debug-error { color: #feb2b2; }
        .debug-warn { color: #fbd38d; }
        .debug-success { color: #9ae6b4; }
        
        #debug-toggle-btn {
            position: fixed;
            bottom: 33vh;
            right: 8px;
            background: radial-gradient(circle at top, var(--accent-strong), var(--accent));
            color: #020617;
            border: 0;
            padding: 5px 12px;
            font-size: 10px;
            z-index: 1000000;
            cursor: pointer;
            font-weight: 600;
            border-radius: 999px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.55);
        }
        
        #debug-toggle-btn:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 4px 18px rgba(56, 189, 248, 0.35);
        }
        
        /* ============================================ */
        /* ГЛАВНЫЙ КОНТЕЙНЕР / КАРТА                   */
        /* ============================================ */
        
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        #map {
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        
        /* Плавное свечение света города */
        .leaflet-container {
            background: radial-gradient(circle at 20% 10%, #111827 0, #020308 40%, #000 80%);
        }
        
        /* Анимация пульсации для точек */
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.12);
                opacity: 0.85;
            }
        }
        
        .treasure-marker {
            animation: pulse 2.3s ease-in-out infinite;
            filter: drop-shadow(0 0 16px rgba(99, 179, 237, 0.8));
            z-index: 1000 !important;
            font-size: 30px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            line-height: 1 !important;
        }
        
        .treasure-marker-claimed {
            opacity: 0.35;
            filter: grayscale(100%) drop-shadow(0 0 4px rgba(148, 163, 184, 0.5));
            animation: none;
            z-index: 500 !important;
        }
        
        .leaflet-marker-icon {
            z-index: 1000 !important;
        }
        
        .leaflet-marker-pane {
            z-index: 600 !important;
        }
        
        /* Анимация для игрока */
        @keyframes player-pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.8);
            }
            50% {
                box-shadow: 0 0 0 18px rgba(79, 209, 197, 0.0);
            }
        }
        
        .player-marker {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30% 20%, #a7f3d0, #22c55e);
            border: 3px solid #0f172a;
            border-radius: 50%;
            animation: player-pulse 2.1s infinite;
            z-index: 2000 !important;
        }
        
        /* ============================================ */
        /* ВЕРХНЯЯ ПАНЕЛЬ (HUD)                        */
        /* ============================================ */
        
        #status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                180deg,
                rgba(9, 11, 20, 0.98) 0%,
                rgba(9, 11, 20, 0.95) 50%,
                rgba(9, 11, 20, 0.75) 100%
            );
            backdrop-filter: blur(var(--blur-glass));
            padding: 14px 16px 12px;
            z-index: 1000;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--glass-border);
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .status-row:last-child {
            margin-bottom: 0;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: radial-gradient(circle at 20% 0%, #38bdf8, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #f9fafb;
            box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.6);
        }
        
        .user-name {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        
        .user-stats {
            font-size: 11px;
            color: var(--text-subtle);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        
        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: radial-gradient(circle at 20% 0%, #fb923c, #b91c1c);
            padding: 6px 13px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            color: #fefce8;
            box-shadow: 0 10px 26px rgba(248, 250, 252, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.09em;
        }
        
        .streak-fire {
            animation: flicker 1.3s infinite;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.8; transform: translateY(-1px); }
        }
        
        /* Прогресс-бар */
        .progress-container {
            margin-top: 8px;
        }
        
        .progress-label {
            font-size: 11px;
            color: var(--text-subtle);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-strong));
            border-radius: 999px;
            transition: width 0.5s ease;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.7);
        }
        
        /* ============================================ */
        /* НИЖНЯЯ ПАНЕЛЬ (НАВИГАЦИЯ)                   */
        /* ============================================ */
        
        #bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                0deg,
                rgba(9, 11, 20, 0.98) 0%,
                rgba(9, 11, 20, 0.92) 50%,
                rgba(9, 11, 20, 0.78) 100%
            );
            backdrop-filter: blur(var(--blur-glass));
            padding: 10px 12px 12px;
            z-index: 1000;
            box-shadow: 0 -18px 40px rgba(0, 0, 0, 0.9);
            border-top: 1px solid var(--glass-border);
        }
        
        /* Компас */
        .compass-container {
            background: rgba(15, 23, 42, 0.9);
            border-radius: var(--radius-xl);
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
        }
        
        .compass-info {
            flex: 1;
        }
        
        .compass-title {
            font-size: 11px;
            color: var(--text-subtle);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        
        .compass-target {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .compass-distance {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-strong);
            margin-top: 2px;
        }
        
        .compass-arrow {
            width: 52px;
            height: 52px;
            border-radius: 999px;
            background: radial-gradient(circle at 20% 0, var(--accent-strong), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #020617;
            transition: transform var(--transition-med);
            box-shadow: 0 14px 30px rgba(56, 189, 248, 0.7);
        }
        
        .nav-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .nav-btn {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 14px;
            padding: 10px 6px 9px;
            color: var(--text-main);
            font-size: 11px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        
        .nav-btn-icon {
            font-size: 19px;
        }
        
        .nav-btn:active {
            transform: translateY(1px) scale(0.97);
            background: rgba(15, 23, 42, 1);
        }
        
        .nav-btn-active {
            background: radial-gradient(circle at 20% 0, var(--accent-strong), var(--accent));
            color: #020617;
            border-color: rgba(148, 163, 184, 0.7);
            box-shadow: 0 10px 26px rgba(56, 189, 248, 0.6);
        }
        
        /* ============================================ */
        /* МОДАЛКИ                                     */
        /* ============================================ */
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), rgba(3, 7, 18, 0.98));
            z-index: 10000;
            overflow-y: auto;
            animation: fadeIn 0.23s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            background: var(--bg-elevated-soft);
            margin: 18px 16px 24px;
            padding: 22px 18px 20px;
            border-radius: var(--radius-xl);
            position: relative;
            animation: slideUp 0.25s ease-out;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(24px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 20px;
            cursor: pointer;
            color: rgba(156, 163, 175, 0.9);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(75, 85, 99, 0.7);
            transition: all var(--transition-fast);
        }
        
        .modal-close:active {
            background: rgba(31, 41, 55, 1);
            transform: scale(0.96);
        }
        
        .modal-header {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .modal-icon {
            font-size: 30px;
        }
        
        /* ============================================ */
        /* ДЕТАЛИ ТОЧКИ                                */
        /* ============================================ */
        
        #treasure-modal .treasure-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 18px;
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        
        .treasure-info {
            margin-bottom: 14px;
        }
        
        .treasure-name {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .treasure-category {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.95);
            color: var(--accent-strong);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 11px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1px solid rgba(56, 189, 248, 0.6);
        }
        
        .treasure-legend {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-subtle);
        }
        
        .treasure-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 18px 0 16px;
        }
        
        .stat-box {
            background: rgba(15, 23, 42, 0.95);
            padding: 11px 10px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(148, 163, 184, 0.4);
        }
        
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-strong);
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-subtle);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        
        .claim-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-med);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        
        .claim-btn-active {
            background: radial-gradient(circle at 20% 0, var(--success), #16a34a);
            color: #022c22;
            box-shadow: 0 12px 30px rgba(34, 197, 94, 0.5);
        }
        
        .claim-btn-disabled {
            background: rgba(15, 23, 42, 0.92);
            color: rgba(156, 163, 175, 0.8);
            cursor: not-allowed;
            border: 1px dashed rgba(75, 85, 99, 0.7);
        }
        
        .claim-btn-active:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
        }
        
        /* ============================================ */
        /* ПРОФИЛЬ                                    */
        /* ============================================ */
        
        .profile-header {
            text-align: center;
            padding: 26px 0 22px;
            background: radial-gradient(circle at 20% 0, #0ea5e9, #020617);
            border-radius: 18px;
            margin-bottom: 18px;
            box-shadow: 0 16px 40px rgba(56, 189, 248, 0.45);
            border: 1px solid rgba(148, 163, 184, 0.5);
        }
        
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 12px;
            color: #e5e7eb;
            border: 2px solid rgba(248, 250, 252, 0.85);
        }
        
        .profile-name {
            font-size: 22px;
            font-weight: 700;
        }
        
        .profile-rank {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 3px;
        }
        
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        
        .achievement-item {
            background: rgba(15, 23, 42, 0.98);
            padding: 12px 8px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(148, 163, 184, 0.4);
        }
        
        .achievement-icon {
            font-size: 26px;
            margin-bottom: 6px;
        }
        
        .achievement-locked {
            opacity: 0.35;
            filter: grayscale(100%);
        }
        
        .achievement-name {
            font-size: 11px;
            color: var(--text-subtle);
        }
        
        /* ============================================ */
        /* ЛИДЕРБОРД                                  */
        /* ============================================ */
        
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        
        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.98);
            padding: 12px 11px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.4);
        }
        
        .rank-number {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: radial-gradient(circle at 20% 0, var(--accent-strong), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 700;
            color: #020617;
        }
        
        .rank-1 {
            background: radial-gradient(circle at 20% 0, #facc15, #fbbf24);
            color: #1f2937;
        }
        
        .rank-2 {
            background: radial-gradient(circle at 20% 0, #e5e7eb, #9ca3af);
            color: #020617;
        }
        
        .rank-3 {
            background: radial-gradient(circle at 20% 0, #f97316, #ea580c);
            color: #020617;
        }
        
        .player-info {
            flex: 1;
        }
        
        .player-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .player-score {
            font-size: 11px;
            color: var(--text-subtle);
        }
        
        .player-points {
            font-size: 19px;
            font-weight: 700;
            color: var(--accent-strong);
        }
        
        /* ============================================ */
        /* СПИСКИ                                      */
        /* ============================================ */
        
        .treasure-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .treasure-list-item {
            background: rgba(15, 23, 42, 0.98);
            padding: 11px 11px;
            border-radius: 14px;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(148, 163, 184, 0.4);
        }
        
        .treasure-list-item:active {
            background: rgba(24, 35, 58, 1);
            transform: scale(0.98);
        }
        
        .treasure-list-icon {
            font-size: 28px;
            width: 44px;
            text-align: center;
        }
        
        .treasure-list-info {
            flex: 1;
        }
        
        .treasure-list-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .treasure-list-distance {
            font-size: 12px;
            color: var(--text-subtle);
        }
        
        .treasure-list-claimed {
            opacity: 0.4;
        }
        
        .claimed-badge {
            background: var(--success);
            color: #022c22;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        
        /* ============================================ */
        /* ЗАГРУЗКА                                   */
        /* ============================================ */
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top, #111827, #020308 60%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100000;
        }
        
        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(148, 163, 184, 0.25);
            border-top: 4px solid var(--accent-strong);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {

    <script>
        // ============================================
        // ПРОСТАЯ DEBUG ПАНЕЛЬ
        // ============================================
        
        const debugLines = [];
        
        function dlog(msg, type = 'info') {
            // Игнорируем спам от Telegram
            if (typeof msg === 'string' && (
                msg.includes('Telegram.WebView') || 
                msg.includes('theme_changed') ||
                msg.includes('receiveEvent')
            )) {
                return;
            }
            
            const time = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'debug-error' : type === 'warn' ? 'debug-warn' : type === 'success' ? 'debug-success' : '';
            const line = `<div class="debug-line ${className}">[${time}] ${msg}</div>`;
            
            debugLines.push(line);
            if (debugLines.length > 50) debugLines.shift();
            
            const output = document.getElementById('debug-output');
            if (output) {
                output.innerHTML = debugLines.join('');
                output.scrollTop = output.scrollHeight;
            }
        }
        
        function toggleDebug() {
            const panel = document.getElementById('debug-panel');
            const btn = document.getElementById('debug-toggle-btn');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                btn.textContent = 'СКРЫТЬ';
            } else {
                panel.classList.add('hidden');
                btn.textContent = 'ПОКАЗАТЬ';
            }
        }
        
        function clearDebug() {
            debugLines.length = 0;
            document.getElementById('debug-output').innerHTML = '';
        }
        
        // ============================================
        // КОНФИГУРАЦИЯ
        // ============================================
        
        const CONFIG = {
            SUPABASE_URL: 'https://otvtqoowhupqxushkmma.supabase.co',
            SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90dnRxb293aHVwcXh1c2hrbW1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzMTEyNzksImV4cCI6MjA3ODg4NzI3OX0.Q9yV-YW1ir9eOIH-eOKTnsbVH0CD2Eruw4eZ7YWajBM',
            CLAIM_DISTANCE: 50, // метров
            MAP_CENTER: [56.3287, 44.0020], // Нижний Новгород (Кремль)
            MAP_ZOOM: 13,
            UPDATE_INTERVAL: 3000, // обновление позиции каждые 3 сек
            POSITION_SMOOTH: true // плавное движение
        };
        
        // ============================================
        // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
        // ============================================
        
        let supabase;
        let map;
        let playerMarker;
        let playerPosition = null;
        let treasures = [];
        let claimedTreasures = [];
        let currentUser = null;
        let treasureMarkers = {};
        let pathPolyline = null;
        let pathCoordinates = [];
        let selectedTreasure = null;
        let watchId = null;
        
        // Достижения
        const ACHIEVEMENTS = [
            { id: 'first', name: 'Первая находка', icon: '🎯', requirement: 1 },
            { id: 'explorer', name: 'Исследователь', icon: '🗺️', requirement: 5 },
            { id: 'treasure_hunter', name: 'Охотник', icon: '💎', requirement: 10 },
            { id: 'master', name: 'Мастер', icon: '👑', requirement: 25 },
            { id: 'legend', name: 'Легенда', icon: '⭐', requirement: 50 },
            { id: 'streak_7', name: 'Неделя подряд', icon: '🔥', requirement: 7, type: 'streak' },
            { id: 'all_categories', name: 'Все категории', icon: '🌈', requirement: 'all', type: 'category' },
            { id: 'speed', name: 'Скоростной', icon: '⚡', requirement: 5, type: 'speed' },
            { id: 'night_owl', name: 'Ночная сова', icon: '🦉', requirement: 1, type: 'night' }
        ];
        
        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                dlog('🚀 Запуск приложения...');
                
                // Инициализация Telegram WebApp
                dlog('1️⃣ Инициализация Telegram...');
                const tg = window.Telegram.WebApp;
                
                // ФИКС: Отключаем debug режим Telegram чтобы не было спама
                if (tg.isVersionAtLeast) {
                    tg.isVersionAtLeast('6.0');
                }
                
                tg.ready();
                tg.expand();
                
                dlog('✅ Telegram инициализирован');
                
                // Инициализация Supabase
                dlog('2️⃣ Инициализация Supabase...');
                supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
                
                // Получение пользователя
                dlog('3️⃣ Получение пользователя...');
                const telegramUser = tg.initDataUnsafe?.user;
                if (!telegramUser || !telegramUser.id) {
                    throw new Error('Откройте через Telegram бот!');
                }
                
                // Загрузка или создание пользователя
                dlog('4️⃣ Загрузка профиля...');
                currentUser = await getOrCreateUser(telegramUser);
                dlog('✅ Пользователь:', currentUser.username);
                
                // Инициализация карты
                dlog('5️⃣ Инициализация карты...');
                await initMap();
                dlog('✅ Карта создана');
                
                // ВАЖНО: Загружаем точки ДО UI
                dlog('6️⃣ Загрузка точек...');
                await loadTreasures();
                
                // Загрузка найденных точек
                dlog('7️⃣ Загрузка находок...');
                await loadClaimedTreasures();
                
                // Обновление UI
                dlog('8️⃣ Обновление интерфейса...');
                updateUI();
                
                // Запуск геолокации
                dlog('9️⃣ Запуск геолокации...');
                startTracking();
                
                // Скрыть загрузку
                dlog('✅ Всё готово! Показываем приложение...');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                
                // ФИКС: Агрессивное обновление карты после показа (несколько попыток)
                const finalFix = () => {
                    try {
                        map.invalidateSize(true);
                        dlog('🗺️ Карта финально обновлена');
                    } catch (e) {
                        dlog('⚠️ Ошибка финального обновления:', e);
                    }
                };
                
                setTimeout(finalFix, 100);
                setTimeout(finalFix, 300);
                setTimeout(finalFix, 500);
                setTimeout(finalFix, 1000);
                
                dlog('🎉 Приложение полностью загружено!');
                
            } catch (error) {
                dlog('💥 Ошибка инициализации:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="spinner"></div>
                    <div class="loading-text" style="color: #f56565;">
                        Ошибка: ${error.message}<br><br>
                        Откройте через Telegram бот!
                    </div>
                `;
            }
        });
        
        // ============================================
        // РАБОТА С ПОЛЬЗОВАТЕЛЕМ
        // ============================================
        
        async function getOrCreateUser(telegramUser) {
            try {
                // Проверяем есть ли пользователь
                let { data: user, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('telegram_id', telegramUser.id)
                    .single();
                
                if (error && error.code === 'PGRST116') {
                    // Создаём нового пользователя
                    const { data: newUser, error: createError } = await supabase
                        .from('users')
                        .insert([{
                            telegram_id: telegramUser.id,
                            username: telegramUser.username || `user${telegramUser.id}`,
                            first_name: telegramUser.first_name,
                            score: 0
                        }])
                        .select()
                        .single();
                    
                    if (createError) throw createError;
                    user = newUser;
                }
                
                return user;
            } catch (error) {
                dlog('Ошибка загрузки пользователя:', error);
                throw error;
            }
        }
        
        // ============================================
        // КАРТА
        // ============================================
        
        async function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView(CONFIG.MAP_CENTER, CONFIG.MAP_ZOOM);
            
            // Тёмная тема карты
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                minZoom: 10
            }).addTo(map);
            
            // Создаём маркер игрока
            const playerIcon = L.divIcon({
                className: 'player-marker',
                iconSize: [20, 20],
                iconAnchor: [10, 10]  // Центр маркера
            });
            
            playerMarker = L.marker(CONFIG.MAP_CENTER, { icon: playerIcon }).addTo(map);
            
            // Инициализация линии пути
            pathPolyline = L.polyline([], {
                color: '#4CAF50',
                weight: 3,
                opacity: 0.7,
                dashArray: '10, 5'
            }).addTo(map);
            
            // ФИКС: Агрессивное обновление размеров карты (несколько попыток)
            const fixMapSize = () => {
                try {
                    map.invalidateSize(true);
                    dlog('✅ Карта обновлена');
                } catch (e) {
                    dlog('⚠️ Ошибка обновления карты:', e);
                }
            };
            
            // Несколько попыток с разными таймаутами
            setTimeout(fixMapSize, 50);
            setTimeout(fixMapSize, 100);
            setTimeout(fixMapSize, 300);
            setTimeout(fixMapSize, 500);
            
            // ФИКС: Обработка изменения ориентации
            window.addEventListener('orientationchange', () => {
                setTimeout(fixMapSize, 100);
                setTimeout(fixMapSize, 300);
            });
            
            // ФИКС: Обработка resize
            window.addEventListener('resize', fixMapSize);
            
            // ФИКС: Обновление при любом взаимодействии
            map.on('movestart', () => {
                setTimeout(fixMapSize, 100);
            });
            
            map.on('zoomstart', () => {
                setTimeout(fixMapSize, 100);
            });
        }
        
        // ============================================
        // ЗАГРУЗКА ТОЧЕК
        // ============================================
        
        async function loadTreasures() {
            try {
                dlog('🔍 Загрузка точек из Supabase...');
                
                const { data, error } = await supabase
                    .from('treasures')
                    .select('*')
                    .eq('active', true);
                
                if (error) {
                    dlog('❌ Ошибка загрузки точек:', error);
                    throw error;
                }
                
                treasures = data || [];
                
                dlog(`✅ Загружено ${treasures.length} точек`);
                
                if (treasures.length === 0) {
                    dlog('⚠️ Нет активных точек в базе!');
                    alert('В базе нет точек! Добавьте через админку.');
                    return;
                }
                
                // Добавляем маркеры на карту
                treasures.forEach((treasure, index) => {
                    dlog(`📍 Добавляем точку #${index + 1}: ${treasure.name}`);
                    addTreasureMarker(treasure);
                });
                
                dlog(`🗺️ Все ${treasures.length} маркеров добавлены на карту`);
                
            } catch (error) {
                dlog('💥 Критическая ошибка загрузки точек:', error);
                alert('Ошибка загрузки точек: ' + error.message);
            }
        }
        
        function addTreasureMarker(treasure) {
            try {
                if (!treasure || !treasure.lat || !treasure.lng) {
                    dlog('❌ Некорректная точка:', treasure);
                    return;
                }
                
                dlog(`🧪 ТЕСТ: Создаем маркер для ${treasure.name} на [${treasure.lat}, ${treasure.lng}]`);
                
                const isClaimed = claimedTreasures.some(c => c.treasure_id === treasure.id);
                
                // ТЕСТ: Используем обычный маркер Leaflet (не divIcon!)
                const marker = L.marker([treasure.lat, treasure.lng], {
                    title: treasure.name,
                    riseOnHover: true,
                    zIndexOffset: isClaimed ? 500 : 1000
                })
                    .addTo(map)
                    .on('click', () => {
                        dlog('🖱️ Клик по точке:', treasure.name);
                        showTreasureDetails(treasure);
                    });
                
                // Добавляем popup с названием
                marker.bindPopup(`<b>${treasure.icon || '💎'} ${treasure.name}</b>`);
                
                treasureMarkers[treasure.id] = marker;
                
                dlog(`✅ ТЕСТ: Маркер добавлен: ${treasure.name} (${treasure.lat}, ${treasure.lng})`);
                
            } catch (error) {
                dlog('❌ Ошибка добавления маркера:', treasure, error);
            }
        }
        
        // ============================================
        // ЗАГРУЗКА НАЙДЕННЫХ ТОЧЕК
        // ============================================
        
        async function loadClaimedTreasures() {
            try {
                const { data, error } = await supabase
                    .from('claims')
                    .select('*')
                    .eq('user_id', currentUser.id);
                
                if (error) throw error;
                
                claimedTreasures = data || [];
                
                dlog(`Найдено ${claimedTreasures.length} точек`);
            } catch (error) {
                dlog('Ошибка загрузки находок:', error);
            }
        }
        
        // ============================================
        // ГЕОЛОКАЦИЯ И ТРЕКИНГ
        // ============================================
        
        function startTracking() {
            if (!navigator.geolocation) {
                alert('Геолокация не поддерживается');
                return;
            }
            
            // Запрашиваем позицию каждые N секунд
            watchId = navigator.geolocation.watchPosition(
                onPositionUpdate,
                onPositionError,
                {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                }
            );
        }
        
        function onPositionUpdate(position) {
            const newPosition = {
                lat: position.coords.latitude,
                lng: position.coords.longitude
            };
            
            // Добавляем в трек
            pathCoordinates.push([newPosition.lat, newPosition.lng]);
            pathPolyline.setLatLngs(pathCoordinates);
            
            // Плавное движение маркера
            if (playerPosition && CONFIG.POSITION_SMOOTH) {
                animateMarker(playerMarker, playerPosition, newPosition, 1000);
            } else {
                playerMarker.setLatLng([newPosition.lat, newPosition.lng]);
            }
            
            playerPosition = newPosition;
            
            // Обновляем компас и дистанции
            updateDistances();
            updateCompass();
            
            // Проверяем близость к выбранной точке
            if (selectedTreasure) {
                checkClaimDistance();
            }
        }
        
        function onPositionError(error) {
            dlog('Ошибка геолокации:', error);
        }
        
        // Плавная анимация движения маркера
        function animateMarker(marker, from, to, duration) {
            const start = Date.now();
            
            function frame() {
                const now = Date.now();
                const progress = Math.min((now - start) / duration, 1);
                
                const lat = from.lat + (to.lat - from.lat) * progress;
                const lng = from.lng + (to.lng - from.lng) * progress;
                
                marker.setLatLng([lat, lng]);
                
                if (progress < 1) {
                    requestAnimationFrame(frame);
                }
            }
            
            requestAnimationFrame(frame);
        }
        
        // ============================================
        // РАСЧЁТ ДИСТАНЦИЙ
        // ============================================
        
        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371e3; // Радиус Земли в метрах
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lng2 - lng1) * Math.PI / 180;
            
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            
            return R * c;
        }
        
        function formatDistance(meters) {
            if (meters < 1000) {
                return Math.round(meters) + 'м';
            } else {
                return (meters / 1000).toFixed(1) + 'км';
            }
        }
        
        function updateDistances() {
            if (!playerPosition) return;
            
            treasures.forEach(treasure => {
                const distance = calculateDistance(
                    playerPosition.lat,
                    playerPosition.lng,
                    treasure.lat,
                    treasure.lng
                );
                treasure.distance = distance;
            });
            
            // Сортируем по дистанции
            treasures.sort((a, b) => a.distance - b.distance);
        }
        
        // ============================================
        // КОМПАС
        // ============================================
        
        function updateCompass() {
            if (!playerPosition || treasures.length === 0) return;
            
            // Находим ближайшую НЕ найденную точку
            const nearest = treasures.find(t => 
                !claimedTreasures.some(c => c.treasure_id === t.id)
            );
            
            if (!nearest) {
                document.getElementById('compass').style.display = 'none';
                return;
            }
            
            document.getElementById('compass').style.display = 'flex';
            document.getElementById('compass-icon').textContent = nearest.icon || '💎';
            document.getElementById('compass-name').textContent = nearest.name;
            document.getElementById('compass-distance').textContent = formatDistance(nearest.distance);
            
            // Вычисляем угол направления
            const angle = calculateBearing(
                playerPosition.lat,
                playerPosition.lng,
                nearest.lat,
                nearest.lng
            );
            
            document.getElementById('compass-arrow').style.transform = `rotate(${angle}deg)`;
        }
        
        function calculateBearing(lat1, lng1, lat2, lng2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lng2 - lng1) * Math.PI / 180;
            
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) -
                      Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            
            const θ = Math.atan2(y, x);
            const bearing = (θ * 180 / Math.PI + 360) % 360;
            
            return bearing;
        }
        
        // ============================================
        // UI ОБНОВЛЕНИЕ
        // ============================================
        
        function updateUI() {
            // Имя пользователя
            const username = currentUser.username || currentUser.first_name || 'Игрок';
            document.getElementById('user-name').textContent = username;
            document.getElementById('user-avatar').textContent = username[0].toUpperCase();
            
            // Статистика
            document.getElementById('user-score').textContent = currentUser.score;
            document.getElementById('user-found').textContent = claimedTreasures.length;
            document.getElementById('user-total').textContent = treasures.length;
            
            // Стрик (заглушка - можно доработать)
            const streak = calculateStreak();
            document.getElementById('streak-days').textContent = streak;
            
            // Прогресс
            const progress = treasures.length > 0 
                ? Math.round((claimedTreasures.length / treasures.length) * 100)
                : 0;
            document.getElementById('progress-percent').textContent = progress + '%';
            document.getElementById('progress-fill').style.width = progress + '%';
        }
        
        function calculateStreak() {
            // Упрощённый расчёт - можно доработать с реальными датами
            if (claimedTreasures.length === 0) return 0;
            
            // Проверяем уникальные дни
            const uniqueDays = new Set(
                claimedTreasures.map(c => new Date(c.claimed_at).toDateString())
            );
            
            return uniqueDays.size;
        }
        
        // ============================================
        // ДЕТАЛИ ТОЧКИ
        // ============================================
        
        function showTreasureDetails(treasure) {
            selectedTreasure = treasure;
            
            // Заполняем данные
            document.getElementById('treasure-modal-category').textContent = treasure.category || 'Общее';
            document.getElementById('treasure-modal-name').textContent = treasure.name;
            document.getElementById('treasure-modal-legend').textContent = treasure.legend || 'Нет описания';
            document.getElementById('treasure-modal-points').textContent = treasure.points;
            
            // Изображение
            const img = document.getElementById('treasure-modal-image');
            if (treasure.image_url) {
                img.src = treasure.image_url;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }
            
            // Дистанция
            if (playerPosition) {
                const distance = calculateDistance(
                    playerPosition.lat,
                    playerPosition.lng,
                    treasure.lat,
                    treasure.lng
                );
                document.getElementById('treasure-modal-distance').textContent = formatDistance(distance);
                treasure.distance = distance;
            }
            
            // Проверка возможности забрать
            checkClaimDistance();
            
            // Показываем модалку
            document.getElementById('treasure-modal').style.display = 'block';
        }
        
        function checkClaimDistance() {
            if (!selectedTreasure || !playerPosition) return;
            
            const distance = selectedTreasure.distance || calculateDistance(
                playerPosition.lat,
                playerPosition.lng,
                selectedTreasure.lat,
                selectedTreasure.lng
            );
            
            const btn = document.getElementById('claim-btn');
            const isClaimed = claimedTreasures.some(c => c.treasure_id === selectedTreasure.id);
            
            if (isClaimed) {
                btn.className = 'claim-btn claim-btn-disabled';
                btn.innerHTML = '<span>✅</span><span>Уже найдено</span>';
            } else if (distance <= CONFIG.CLAIM_DISTANCE) {
                btn.className = 'claim-btn claim-btn-active';
                btn.innerHTML = '<span>🎯</span><span>Забрать точку!</span>';
            } else {
                btn.className = 'claim-btn claim-btn-disabled';
                btn.innerHTML = `<span>🔒</span><span>Подойдите ближе (${Math.round(distance)}м)</span>`;
            }
        }
        
        // ============================================
        // ЗАБРАТЬ ТОЧКУ
        // ============================================
        
        async function claimTreasure() {
            if (!selectedTreasure || !playerPosition) return;
            
            const distance = selectedTreasure.distance;
            const isClaimed = claimedTreasures.some(c => c.treasure_id === selectedTreasure.id);
            
            if (isClaimed) {
                alert('Вы уже нашли эту точку!');
                return;
            }
            
            if (distance > CONFIG.CLAIM_DISTANCE) {
                alert(`Подойдите ближе! Осталось ${Math.round(distance - CONFIG.CLAIM_DISTANCE)}м`);
                return;
            }
            
            try {
                // Добавляем находку
                const { error: claimError } = await supabase
                    .from('claims')
                    .insert([{
                        user_id: currentUser.id,
                        treasure_id: selectedTreasure.id
                    }]);
                
                if (claimError) throw claimError;
                
                // Обновляем очки
                const newScore = currentUser.score + selectedTreasure.points;
                const { error: updateError } = await supabase
                    .from('users')
                    .update({ score: newScore })
                    .eq('id', currentUser.id);
                
                if (updateError) throw updateError;
                
                currentUser.score = newScore;
                
                // Добавляем в список найденных
                claimedTreasures.push({
                    user_id: currentUser.id,
                    treasure_id: selectedTreasure.id,
                    claimed_at: new Date().toISOString()
                });
                
                // Обновляем маркер
                const marker = treasureMarkers[selectedTreasure.id];
                if (marker) {
                    marker.setIcon(L.divIcon({
                        className: 'treasure-marker treasure-marker-claimed',
                        html: `<div style="font-size: 32px;">${selectedTreasure.icon || '💎'}</div>`,
                        iconSize: [40, 40],
                        iconAnchor: [20, 40]
                    }));
                }
                
                // Обновляем UI
                updateUI();
                
                // Показываем успех
                showSuccess(selectedTreasure);
                
                // Закрываем детали
                closeModal('treasure-modal');
                
            } catch (error) {
                dlog('Ошибка при находке:', error);
                alert('Ошибка: ' + error.message);
            }
        }
        
        function showSuccess(treasure) {
            document.getElementById('success-points').textContent = treasure.points;
            document.getElementById('success-message').textContent = 
                `Вы нашли "${treasure.name}"!`;
            document.getElementById('success-modal').style.display = 'block';
            
            // Вибрация (если поддерживается)
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200]);
            }
        }
        
        // ============================================
        // НАВИГАЦИЯ
        // ============================================
        
        function showMap() {
            closeAllModals();
            updateNavButtons('map');
        }
        
        function showList() {
            renderList();
            document.getElementById('list-modal').style.display = 'block';
            updateNavButtons('list');
        }
        
        function showProfile() {
            renderProfile();
            document.getElementById('profile-modal').style.display = 'block';
            updateNavButtons('profile');
        }
        
        function showLeaderboard() {
            renderLeaderboard();
            document.getElementById('leaderboard-modal').style.display = 'block';
            updateNavButtons('leaderboard');
        }
        
        function updateNavButtons(active) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('nav-btn-active');
            });
            
            const buttons = {
                'map': 0,
                'list': 1,
                'profile': 2,
                'leaderboard': 3
            };
            
            const index = buttons[active];
            if (index !== undefined) {
                document.querySelectorAll('.nav-btn')[index].classList.add('nav-btn-active');
            }
        }
        
        // ============================================
        // СПИСОК ТОЧЕК
        // ============================================
        
        function renderList() {
            const container = document.getElementById('treasure-list');
            
            if (treasures.length === 0) {
                container.innerHTML = '<div class="text-center">Нет доступных точек</div>';
                return;
            }
            
            const html = treasures.map(treasure => {
                const isClaimed = claimedTreasures.some(c => c.treasure_id === treasure.id);
                const distance = treasure.distance ? formatDistance(treasure.distance) : '---';
                
                return `
                    <div class="treasure-list-item ${isClaimed ? 'treasure-list-claimed' : ''}" 
                         onclick="showTreasureFromList(${treasure.id})">
                        <div class="treasure-list-icon">${treasure.icon || '💎'}</div>
                        <div class="treasure-list-info">
                            <div class="treasure-list-name">${treasure.name}</div>
                            <div class="treasure-list-distance">${distance} • ${treasure.points} очков</div>
                        </div>
                        ${isClaimed ? '<div class="claimed-badge">✓ Найдено</div>' : ''}
                    </div>
                `;
            }).join('');
            
            container.innerHTML = html;
        }
        
        function showTreasureFromList(treasureId) {
            const treasure = treasures.find(t => t.id === treasureId);
            if (treasure) {
                closeModal('list-modal');
                
                // Центрируем карту на точке
                map.setView([treasure.lat, treasure.lng], 16, {
                    animate: true,
                    duration: 0.5
                });
                
                // ФИКС: Обновляем карту после анимации
                setTimeout(() => {
                    map.invalidateSize(true);
                    
                    // ФИКС: Подсвечиваем маркер
                    const marker = treasureMarkers[treasure.id];
                    if (marker) {
                        // Небольшая анимация "прыжка"
                        marker.setZIndexOffset(2000);
                        setTimeout(() => {
                            marker.setZIndexOffset(treasure.id === selectedTreasure?.id ? 1000 : 500);
                        }, 500);
                    }
                    
                    // Показываем детали
                    showTreasureDetails(treasure);
                }, 600);
            }
        }
        
        // ============================================
        // ПРОФИЛЬ
        // ============================================
        
        function renderProfile() {
            const username = currentUser.username || currentUser.first_name || 'Игрок';
            
            document.getElementById('profile-avatar').textContent = username[0].toUpperCase();
            document.getElementById('profile-name').textContent = username;
            document.getElementById('profile-score').textContent = currentUser.score;
            document.getElementById('profile-found').textContent = claimedTreasures.length;
            document.getElementById('profile-streak').textContent = calculateStreak();
            
            // Достижения
            const achievementsHTML = ACHIEVEMENTS.map(achievement => {
                const unlocked = checkAchievement(achievement);
                return `
                    <div class="achievement-item ${unlocked ? '' : 'achievement-locked'}">
                        <div class="achievement-icon">${achievement.icon}</div>
                        <div class="achievement-name">${achievement.name}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('achievements-grid').innerHTML = achievementsHTML;
            
            // Загрузить ранг (заглушка)
            document.getElementById('profile-rank').textContent = '#? в рейтинге';
        }
        
        function checkAchievement(achievement) {
            if (achievement.type === 'streak') {
                return calculateStreak() >= achievement.requirement;
            }
            return claimedTreasures.length >= achievement.requirement;
        }
        
        // ============================================
        // ЛИДЕРБОРД
        // ============================================
        
        async function renderLeaderboard() {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .order('score', { ascending: false })
                    .limit(20);
                
                if (error) throw error;
                
                const container = document.getElementById('leaderboard-list');
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="text-center">Нет игроков</div>';
                    return;
                }
                
                const html = data.map((user, index) => {
                    const rank = index + 1;
                    const rankClass = rank <= 3 ? `rank-${rank}` : '';
                    const isMe = user.id === currentUser.id;
                    
                    return `
                        <div class="leaderboard-item" style="${isMe ? 'background: rgba(15, 23, 42, 0.98); box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.65);' : ''}">
                            <div class="rank-number ${rankClass}">${rank}</div>
                            <div class="player-info">
                                <div class="player-name">
                                    ${user.username || user.first_name || 'Игрок'}
                                    ${isMe ? '(Вы)' : ''}
                                </div>
                                <div class="player-score">
                                    Найдено: ${user.score / 10} точек
                                </div>
                            </div>
                            <div class="player-points">${user.score}</div>
                        </div>
                    `;
                }).join('');
                
                container.innerHTML = html;
                
            } catch (error) {
                dlog('Ошибка загрузки лидерборда:', error);
                document.getElementById('leaderboard-list').innerHTML = 
                    '<div class="text-center">Ошибка загрузки</div>';
            }
        }
        
        // ============================================
        // МОДАЛЬНЫЕ ОКНА
        // ============================================
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            selectedTreasure = null;
        }
        
        function closeAllModals() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.style.display = 'none';
            });
            selectedTreasure = null;
        }
        
        // Закрытие при клике вне контента
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
