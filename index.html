<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Охота за сокровищами • Нижний Новгород</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Leaflet для карты -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        /* ============================================ */
        /* ГЛАВНЫЙ КОНТЕЙНЕР */
        /* ============================================ */
        
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        /* ============================================ */
        /* КАРТА */
        /* ============================================ */
        
        #map {
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        
        /* Анимация пульсации для точек */
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.8;
            }
        }
        
        .treasure-marker {
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(102, 126, 234, 0.6));
            z-index: 1000 !important;
        }
        
        .treasure-marker-claimed {
            opacity: 0.4;
            filter: grayscale(100%);
            animation: none;
            z-index: 500 !important;
        }
        
        /* ФИКС: Центрирование divIcon */
        .treasure-marker,
        .treasure-marker-claimed {
            margin-left: -20px !important;
            margin-top: -20px !important;
        }
        
        /* Фикс для Leaflet маркеров */
        .leaflet-marker-icon {
            z-index: 1000 !important;
        }
        
        .leaflet-marker-pane {
            z-index: 600 !important;
        }
        
        /* Анимация для игрока */
        @keyframes player-pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(76, 175, 80, 0);
            }
        }
        
        .player-marker {
            width: 20px;
            height: 20px;
            background: #4CAF50;
            border: 3px solid #fff;
            border-radius: 50%;
            animation: player-pulse 2s infinite;
            z-index: 2000 !important;
            margin-left: -10px !important;
            margin-top: -10px !important;
        }
        
        /* ============================================ */
        /* ВЕРХНЯЯ ПАНЕЛЬ (СТАТУС) */
        /* ============================================ */
        
        #status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(10, 14, 39, 0.95) 0%, rgba(10, 14, 39, 0.8) 100%);
            backdrop-filter: blur(10px);
            padding: 15px;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .status-row:last-child {
            margin-bottom: 0;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        
        .user-name {
            font-size: 16px;
            font-weight: 600;
        }
        
        .user-stats {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .streak-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .streak-fire {
            animation: flicker 1.5s infinite;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        /* Прогресс-бар */
        .progress-container {
            margin-top: 10px;
        }
        
        .progress-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        /* ============================================ */
        /* НИЖНЯЯ ПАНЕЛЬ (НАВИГАЦИЯ) */
        /* ============================================ */
        
        #bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, rgba(10, 14, 39, 0.95) 0%, rgba(10, 14, 39, 0.8) 100%);
            backdrop-filter: blur(10px);
            padding: 10px;
            z-index: 1000;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.3);
        }
        
        /* Компас к ближайшей точке */
        .compass-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .compass-info {
            flex: 1;
        }
        
        .compass-title {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
        }
        
        .compass-target {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .compass-distance {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        
        .compass-arrow {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: transform 0.3s ease;
        }
        
        /* Навигационные кнопки */
        .nav-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 12px;
            padding: 12px 8px;
            color: #fff;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .nav-btn:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }
        
        .nav-btn-icon {
            font-size: 20px;
        }
        
        .nav-btn-active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        /* ============================================ */
        /* МОДАЛЬНЫЕ ОКНА */
        /* ============================================ */
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            overflow-y: auto;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            background: #1a202c;
            margin: 20px;
            padding: 25px;
            border-radius: 20px;
            position: relative;
            animation: slideUp 0.3s;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #888;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .modal-close:active {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .modal-header {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .modal-icon {
            font-size: 32px;
        }
        
        /* ============================================ */
        /* ДЕТАЛИ ТОЧКИ */
        /* ============================================ */
        
        #treasure-modal .treasure-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .treasure-info {
            margin-bottom: 15px;
        }
        
        .treasure-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .treasure-category {
            display: inline-block;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
        }
        
        .treasure-legend {
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }
        
        .treasure-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }
        
        .claim-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .claim-btn-active {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: #fff;
        }
        
        .claim-btn-disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
        }
        
        .claim-btn-active:active {
            transform: scale(0.98);
        }
        
        /* ============================================ */
        /* ПРОФИЛЬ */
        /* ============================================ */
        
        .profile-header {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 15px;
        }
        
        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .profile-rank {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .achievement-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        
        .achievement-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .achievement-locked {
            opacity: 0.3;
            filter: grayscale(100%);
        }
        
        .achievement-name {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* ============================================ */
        /* ЛИДЕРБОРД */
        /* ============================================ */
        
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
        }
        
        .rank-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
        }
        
        .rank-1 {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #000;
        }
        
        .rank-2 {
            background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 100%);
            color: #000;
        }
        
        .rank-3 {
            background: linear-gradient(135deg, #cd7f32 0%, #e8a87c 100%);
            color: #000;
        }
        
        .player-info {
            flex: 1;
        }
        
        .player-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .player-score {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .player-points {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }
        
        /* ============================================ */
        /* СПИСКИ */
        /* ============================================ */
        
        .treasure-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .treasure-list-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .treasure-list-item:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.98);
        }
        
        .treasure-list-icon {
            font-size: 32px;
            width: 50px;
            text-align: center;
        }
        
        .treasure-list-info {
            flex: 1;
        }
        
        .treasure-list-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .treasure-list-distance {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .treasure-list-claimed {
            opacity: 0.5;
        }
        
        .claimed-badge {
            background: #4CAF50;
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        
        /* ============================================ */
        /* ЗАГРУЗКА */
        /* ============================================ */
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0e27;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100000;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 20px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* ============================================ */
        /* УСПЕШНАЯ НАХОДКА */
        /* ============================================ */
        
        .success-animation {
            text-align: center;
            padding: 20px 0;
        }
        
        .success-icon {
            font-size: 80px;
            animation: successPop 0.5s ease;
        }
        
        @keyframes successPop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .success-title {
            font-size: 28px;
            font-weight: 700;
            margin: 20px 0 10px;
        }
        
        .success-points {
            font-size: 48px;
            font-weight: 700;
            color: #4CAF50;
            margin: 10px 0;
        }
        
        .success-message {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }
        
        /* ============================================ */
        /* УТИЛИТЫ */
        /* ============================================ */
        
        .text-center { text-align: center; }
        .mb-10 { margin-bottom: 10px; }
        .mb-20 { margin-bottom: 20px; }
        .mt-20 { margin-top: 20px; }
    </style>
</head>
<body>
    <!-- Загрузка -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка карты...</div>
    </div>
    
    <!-- Главное приложение -->
    <div id="app" style="display: none;">
        <!-- Карта -->
        <div id="map"></div>
        
        <!-- Верхняя панель -->
        <div id="status-bar">
            <div class="status-row">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">👤</div>
                    <div>
                        <div class="user-name" id="user-name">Загрузка...</div>
                        <div class="user-stats">
                            <span id="user-score">0</span> очков • 
                            <span id="user-found">0</span>/<span id="user-total">0</span> найдено
                        </div>
                    </div>
                </div>
                <div class="streak-badge">
                    <span class="streak-fire">🔥</span>
                    <span id="streak-days">0</span>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-label">
                    <span>Прогресс</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <!-- Нижняя панель -->
        <div id="bottom-panel">
            <!-- Компас -->
            <div class="compass-container" id="compass" style="display: none;">
                <div class="compass-info">
                    <div class="compass-title">Ближайшая точка</div>
                    <div class="compass-target">
                        <span id="compass-icon">💎</span>
                        <span id="compass-name">Загрузка...</span>
                    </div>
                    <div class="compass-distance" id="compass-distance">---м</div>
                </div>
                <div class="compass-arrow" id="compass-arrow">
                    ↑
                </div>
            </div>
            
            <!-- Навигация -->
            <div class="nav-buttons">
                <button class="nav-btn nav-btn-active" onclick="showMap()">
                    <span class="nav-btn-icon">🗺️</span>
                    <span>Карта</span>
                </button>
                <button class="nav-btn" onclick="showList()">
                    <span class="nav-btn-icon">📍</span>
                    <span>Список</span>
                </button>
                <button class="nav-btn" onclick="showProfile()">
                    <span class="nav-btn-icon">👤</span>
                    <span>Профиль</span>
                </button>
                <button class="nav-btn" onclick="showLeaderboard()">
                    <span class="nav-btn-icon">🏆</span>
                    <span>Топ</span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно: Детали точки -->
    <div id="treasure-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('treasure-modal')">&times;</span>
            <img id="treasure-modal-image" class="treasure-image" src="" alt="" style="display: none;">
            <div class="treasure-info">
                <div class="treasure-category" id="treasure-modal-category">История</div>
                <div class="treasure-name" id="treasure-modal-name">Загрузка...</div>
                <div class="treasure-legend" id="treasure-modal-legend"></div>
            </div>
            <div class="treasure-stats">
                <div class="stat-box">
                    <div class="stat-value" id="treasure-modal-points">0</div>
                    <div class="stat-label">Очков</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="treasure-modal-distance">---м</div>
                    <div class="stat-label">Расстояние</div>
                </div>
            </div>
            <button class="claim-btn claim-btn-disabled" id="claim-btn" onclick="claimTreasure()">
                <span>🔒</span>
                <span>Слишком далеко</span>
            </button>
        </div>
    </div>
    
    <!-- Модальное окно: Список точек -->
    <div id="list-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('list-modal')">&times;</span>
            <div class="modal-header">
                <span class="modal-icon">📍</span>
                <span>Все точки</span>
            </div>
            <div class="treasure-list" id="treasure-list"></div>
        </div>
    </div>
    
    <!-- Модальное окно: Профиль -->
    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('profile-modal')">&times;</span>
            <div class="profile-header">

        // Плавная анимация движения маркера
        function animateMarker(marker, from, to, duration) {
            const start = Date.now();
            
            function frame() {
                const now = Date.now();
                const progress = Math.min((now - start) / duration, 1);
                
                const lat = from.lat + (to.lat - from.lat) * progress;
                const lng = from.lng + (to.lng - from.lng) * progress;
                
                marker.setLatLng([lat, lng]);
                
                if (progress < 1) {
                    requestAnimationFrame(frame);
                }
            }
            
            requestAnimationFrame(frame);
        }
        
        // ============================================
        // РАСЧЁТ ДИСТАНЦИЙ
        // ============================================
        
        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371e3; // Радиус Земли в метрах
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lng2 - lng1) * Math.PI / 180;
            
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            
            return R * c;
        }
        
        function formatDistance(meters) {
            if (meters < 1000) {
                return Math.round(meters) + 'м';
            } else {
                return (meters / 1000).toFixed(1) + 'км';
            }
        }
        
        function updateDistances() {
            if (!playerPosition) {
                console.log('⚠️ updateDistances: Нет позиции игрока');
                return;
            }
            
            console.log(`📍 Обновление дистанций. Позиция игрока: ${playerPosition.lat}, ${playerPosition.lng}`);
            console.log(`📊 Точек для расчёта: ${treasures.length}`);
            
            treasures.forEach((treasure, index) => {
                if (!treasure.lat || !treasure.lng) {
                    console.error(`❌ Точка "${treasure.name}" без координат!`);
                    treasure.distance = null;
                    return;
                }
                
                const distance = calculateDistance(
                    playerPosition.lat,
                    playerPosition.lng,
                    treasure.lat,
                    treasure.lng
                );
                
                treasure.distance = distance;
                
                console.log(`   ${index + 1}. ${treasure.name}: ${formatDistance(distance)}`);
            });
            
            // Сортируем по дистанции
            treasures.sort((a, b) => {
                if (!a.distance) return 1;
                if (!b.distance) return -1;
                return a.distance - b.distance;
            });
            
            console.log(`✅ Дистанции обновлены`);
        }
        
        // ============================================
        // КОМПАС
        // ============================================
        
        function updateCompass() {
            if (!playerPosition || treasures.length === 0) return;
            
            // Находим ближайшую НЕ найденную точку
            const nearest = treasures.find(t => 
                !claimedTreasures.some(c => c.treasure_id === t.id)
            );
            
            if (!nearest) {
                document.getElementById('compass').style.display = 'none';
                return;
            }
            
            document.getElementById('compass').style.display = 'flex';
            document.getElementById('compass-icon').textContent = nearest.icon || '💎';
            document.getElementById('compass-name').textContent = nearest.name;
            document.getElementById('compass-distance').textContent = formatDistance(nearest.distance);
            
            // Вычисляем угол направления
            const angle = calculateBearing(
                playerPosition.lat,
                playerPosition.lng,
                nearest.lat,
                nearest.lng
            );
            
            document.getElementById('compass-arrow').style.transform = `rotate(${angle}deg)`;
        }
        
        function calculateBearing(lat1, lng1, lat2, lng2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lng2 - lng1) * Math.PI / 180;
            
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) -
                      Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            
            const θ = Math.atan2(y, x);
            const bearing = (θ * 180 / Math.PI + 360) % 360;
            
            return bearing;
        }

        function calculateStreak() {
            // Упрощённый расчёт - можно доработать с реальными датами

            );
            
            return uniqueDays.size;

            selectedTreasure = treasure;
            
            // Заполняем данные
            document.getElementById('treasure-modal-category').textContent = treasure.category || 'Общее';
            document.getElementById('treasure-modal-name').textContent = treasure.name;
            document.getElementById('treasure-modal-legend').textContent = treasure.legend || 'Нет описания';
            document.getElementById('treasure-modal-points').textContent = treasure.points;
            
            // Изображение
            const img = document.getElementById('treasure-modal-image');
            if (treasure.image_url) {
                img.src = treasure.image_url;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }
            
            // Дистанция
            if (playerPosition) {
                const distance = calculateDistance(
                    playerPosition.lat,
                    playerPosition.lng,
                    treasure.lat,
                    treasure.lng
                );
                document.getElementById('treasure-modal-distance').textContent = formatDistance(distance);
                treasure.distance = distance;
            }
            
            // Проверка возможности забрать
            checkClaimDistance();
            
            // Показываем модалку
            document.getElementById('treasure-modal').style.display = 'block';
        }
        
        function checkClaimDistance() {
            if (!selectedTreasure || !playerPosition) return;
            
            const distance = selectedTreasure.distance || calculateDistance(
                playerPosition.lat,
                playerPosition.lng,
                selectedTreasure.lat,
                selectedTreasure.lng
            );
            
            const btn = document.getElementById('claim-btn');
            const isClaimed = claimedTreasures.some(c => c.treasure_id === selectedTreasure.id);
            
            if (isClaimed) {
                btn.className = 'claim-btn claim-btn-disabled';
                btn.innerHTML = '<span>✅</span><span>Уже найдено</span>';
            } else if (distance <= CONFIG.CLAIM_DISTANCE) {
                btn.className = 'claim-btn claim-btn-active';
                btn.innerHTML = '<span>🎯</span><span>Забрать точку!</span>';
            } else {
                btn.className = 'claim-btn claim-btn-disabled';
                btn.innerHTML = `<span>🔒</span><span>Подойдите ближе (${Math.round(distance)}м)</span>`;
            }
        }
        
        // ============================================
        // ЗАБРАТЬ ТОЧКУ
        // ============================================
        
        async function claimTreasure() {
            if (!selectedTreasure || !playerPosition) return;
            
            const distance = selectedTreasure.distance;
            const isClaimed = claimedTreasures.some(c => c.treasure_id === selectedTreasure.id);
            
            if (isClaimed) {
                alert('Вы уже нашли эту точку!');
                return;
            }
            
            if (distance > CONFIG.CLAIM_DISTANCE) {
                alert(`Подойдите ближе! Осталось ${Math.round(distance - CONFIG.CLAIM_DISTANCE)}м`);
                return;
            }
            
            try {
                // Добавляем находку
                const { error: claimError } = await supabase
                    .from('claims')
                    .insert([{
                        user_id: currentUser.id,
                        treasure_id: selectedTreasure.id
                    }]);
                
                if (claimError) throw claimError;
                
                // Обновляем очки
                const newScore = currentUser.score + selectedTreasure.points;
                const { error: updateError } = await supabase
                    .from('users')
                    .update({ score: newScore })
                    .eq('id', currentUser.id);
                
                if (updateError) throw updateError;
                
                currentUser.score = newScore;
                
                // Добавляем в список найденных
                claimedTreasures.push({
                    user_id: currentUser.id,
                    treasure_id: selectedTreasure.id,
                    claimed_at: new Date().toISOString()
                });
                
                // Обновляем маркер
                const marker = treasureMarkers[selectedTreasure.id];
                if (marker) {
                    marker.setIcon(L.divIcon({
                        className: 'treasure-marker treasure-marker-claimed',
                        html: `<div style="font-size: 32px;">${selectedTreasure.icon || '💎'}</div>`,
                        iconSize: [40, 40],
                        iconAnchor: [20, 40]
                    }));
                }
                
                // Обновляем UI
                updateUI();
                
                // Показываем успех
                showSuccess(selectedTreasure);
                
                // Закрываем детали
                closeModal('treasure-modal');
                
            } catch (error) {
                console.error('Ошибка при находке:', error);
                alert('Ошибка: ' + error.message);
            }
        }
        
        function showSuccess(treasure) {
            document.getElementById('success-points').textContent = treasure.points;
            document.getElementById('success-message').textContent = 
                `Вы нашли "${treasure.name}"!`;
            document.getElementById('success-modal').style.display = 'block';
            
            // Вибрация (если поддерживается)
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200]);
            }
        }
        
        // ============================================
        // НАВИГАЦИЯ
        // ============================================
        
        function showMap() {
            closeAllModals();
            updateNavButtons('map');
        }
        
        function showList() {
            renderList();
            document.getElementById('list-modal').style.display = 'block';
            updateNavButtons('list');
        }
        
        function showProfile() {
            renderProfile();
            document.getElementById('profile-modal').style.display = 'block';
            updateNavButtons('profile');
        }
        
        function showLeaderboard() {
            renderLeaderboard();
            document.getElementById('leaderboard-modal').style.display = 'block';
            updateNavButtons('leaderboard');
        }
        
        function updateNavButtons(active) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('nav-btn-active');
            });
            
            const buttons = {
                'map': 0,
                'list': 1,
                'profile': 2,
                'leaderboard': 3
            };
            
            const index = buttons[active];
            if (index !== undefined) {
                document.querySelectorAll('.nav-btn')[index].classList.add('nav-btn-active');
            }
        }
        
        // ============================================
        // СПИСОК ТОЧЕК
        // ============================================
        
        function renderList() {
            const container = document.getElementById('treasure-list');
            
            if (treasures.length === 0) {
                container.innerHTML = '<div class="text-center">Нет доступных точек</div>';
                return;
            }
            
            const html = treasures.map(treasure => {
                const isClaimed = claimedTreasures.some(c => c.treasure_id === treasure.id);
                const distance = treasure.distance ? formatDistance(treasure.distance) : '---';
                
                return `
                    <div class="treasure-list-item ${isClaimed ? 'treasure-list-claimed' : ''}" 
                         onclick="showTreasureFromList(${treasure.id})">
                        <div class="treasure-list-icon">${treasure.icon || '💎'}</div>
                        <div class="treasure-list-info">
                            <div class="treasure-list-name">${treasure.name}</div>
                            <div class="treasure-list-distance">${distance} • ${treasure.points} очков</div>
                        </div>
                        ${isClaimed ? '<div class="claimed-badge">✓ Найдено</div>' : ''}
                    </div>
                `;
            }).join('');
            
            container.innerHTML = html;
        }
        
        function showTreasureFromList(treasureId) {
            const treasure = treasures.find(t => t.id === treasureId);
            if (treasure) {
                closeModal('list-modal');
                
                // Центрируем карту на точке
                map.setView([treasure.lat, treasure.lng], 16, {
                    animate: true,
                    duration: 0.5
                });
                
                // ФИКС: Обновляем карту после анимации
                setTimeout(() => {
                    map.invalidateSize(true);
                    
                    // ФИКС: Подсвечиваем маркер
                    const marker = treasureMarkers[treasure.id];
                    if (marker) {
                        // Небольшая анимация "прыжка"
                        marker.setZIndexOffset(2000);
                        setTimeout(() => {
                            marker.setZIndexOffset(treasure.id === selectedTreasure?.id ? 1000 : 500);
                        }, 500);
                    }
                    
                    // Показываем детали
                    showTreasureDetails(treasure);
                }, 600);
            }
        }
        
        // ============================================
        // ПРОФИЛЬ
        // ============================================
        
        function renderProfile() {
            const username = currentUser.username || currentUser.first_name || 'Игрок';
            
            document.getElementById('profile-avatar').textContent = username[0].toUpperCase();
            document.getElementById('profile-name').textContent = username;
            document.getElementById('profile-score').textContent = currentUser.score;
            document.getElementById('profile-found').textContent = claimedTreasures.length;
            document.getElementById('profile-streak').textContent = calculateStreak();
            
            // Достижения
            const achievementsHTML = ACHIEVEMENTS.map(achievement => {
                const unlocked = checkAchievement(achievement);
                return `
                    <div class="achievement-item ${unlocked ? '' : 'achievement-locked'}">
                        <div class="achievement-icon">${achievement.icon}</div>
                        <div class="achievement-name">${achievement.name}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('achievements-grid').innerHTML = achievementsHTML;
            
            // Загрузить ранг (заглушка)
            document.getElementById('profile-rank').textContent = '#? в рейтинге';
        }
        
        function checkAchievement(achievement) {
            if (achievement.type === 'streak') {
                return calculateStreak() >= achievement.requirement;
            }
            return claimedTreasures.length >= achievement.requirement;
        }
        
        // ============================================
        // ЛИДЕРБОРД
        // ============================================
        
        async function renderLeaderboard() {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .order('score', { ascending: false })
                    .limit(20);
                
                if (error) throw error;
                
                const container = document.getElementById('leaderboard-list');
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="text-center">Нет игроков</div>';
                    return;
                }
                
                const html = data.map((user, index) => {
                    const rank = index + 1;
                    const rankClass = rank <= 3 ? `rank-${rank}` : '';
                    const isMe = user.id === currentUser.id;
                    
                    return `
                        <div class="leaderboard-item" style="${isMe ? 'background: rgba(102, 126, 234, 0.2);' : ''}">
                            <div class="rank-number ${rankClass}">${rank}</div>
                            <div class="player-info">
                                <div class="player-name">
                                    ${user.username || user.first_name || 'Игрок'}
                                    ${isMe ? '(Вы)' : ''}
                                </div>
                                <div class="player-score">
                                    Найдено: ${user.score / 10} точек
                                </div>
                            </div>
                            <div class="player-points">${user.score}</div>
                        </div>
                    `;
                }).join('');
                
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Ошибка загрузки лидерборда:', error);
                document.getElementById('leaderboard-list').innerHTML = 
                    '<div class="text-center">Ошибка загрузки</div>';
            }
        }
        
        // ============================================
        // МОДАЛЬНЫЕ ОКНА
        // ============================================
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            selectedTreasure = null;
        }
        
        function closeAllModals() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.style.display = 'none';
            });
            selectedTreasure = null;
        }
        
        // Закрытие при клике вне контента
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
