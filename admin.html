<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель • Охота за сокровищами</title>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: #fff;
            padding: 20px;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
        }
        
        h1 { font-size: 32px; margin-bottom: 10px; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
        }
        
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #667eea;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        
        .btn-danger {
            background: #f56565;
            color: #fff;
        }
        
        .btn-success {
            background: #48bb78;
            color: #fff;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        th {
            background: rgba(102, 126, 234, 0.2);
            font-weight: 600;
        }
        
        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 15px;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-content {
            background: #1a202c;
            padding: 30px;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .close-modal {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #888;
        }
        
        .close-modal:hover {
            color: #fff;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .icon {
            font-size: 24px;
        }
        
        .status-active {
            color: #48bb78;
        }
        
        .status-inactive {
            color: #f56565;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Админ-панель</h1>
            <p>Управление точками и статистика</p>
        </header>
        
        <!-- Статистика -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="total-treasures">0</div>
                <div class="stat-label">Всего точек</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="active-treasures">0</div>
                <div class="stat-label">Активных</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-users">0</div>
                <div class="stat-label">Пользователей</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-claims">0</div>
                <div class="stat-label">Находок</div>
            </div>
        </div>
        
        <!-- Управление точками -->
        <div class="section">
            <h2>📍 Управление точками</h2>
            <button class="btn btn-primary" onclick="showAddModal()">+ Добавить точку</button>
            
            <div id="treasures-loading" class="loading">Загрузка...</div>
            <table id="treasures-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Иконка</th>
                        <th>Название</th>
                        <th>Категория</th>
                        <th>Очки</th>
                        <th>Статус</th>
                        <th>Описание</th>
                        <th>Изображение</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="treasures-list"></tbody>
            </table>
        </div>
        
        <!-- Топ пользователей -->
        <div class="section">
            <h2>🏆 Топ пользователей</h2>
            <div id="users-loading" class="loading">Загрузка...</div>
            <table id="users-table" style="display: none;">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Пользователь</th>
                        <th>Очки</th>
                        <th>Найдено</th>
                    </tr>
                </thead>
                <tbody id="users-list"></tbody>
            </table>
        </div>
    </div>
    
    <!-- Модальное окно добавления/редактирования -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Добавить точку</h2>
            
            <form id="treasure-form" onsubmit="saveTreasure(event)">
                <div class="form-group">
                    <label>Название *</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-group">
                    <label>Иконка (эмодзи)</label>
                    <input type="text" id="icon" placeholder="💎">
                </div>
                
                <div class="form-group">
                    <label>Легенда *</label>
                    <textarea id="legend" required placeholder="Историческая справка..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Описание (авто-генерируется из легенды)</label>
                    <textarea id="description" placeholder="Будет сгенерировано автоматически..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>URL изображения (авто-генерируется)</label>
                    <input type="text" id="image_url" placeholder="Будет сгенерирован автоматически">
                </div>
                
                <div class="form-group">
                    <label>Категория</label>
                    <select id="category">
                        <option value="history">История</option>
                        <option value="nature">Природа</option>
                        <option value="culture">Культура</option>
                        <option value="architecture">Архитектура</option>
                        <option value="church">Церковь</option>
                        <option value="monument">Памятник</option>
                        <option value="museum">Музей</option>
                        <option value="kremlin">Кремль</option>
                        <option value="park">Парк</option>
                        <option value="river">Река</option>
                        <option value="square">Площадь</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Широта *</label>
                    <input type="number" step="any" id="lat" required>
                </div>
                
                <div class="form-group">
                    <label>Долгота *</label>
                    <input type="number" step="any" id="lng" required>
                </div>
                
                <div class="form-group">
                    <label>Очки</label>
                    <input type="number" id="points" value="10">
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="active" checked> Активна
                    </label>
                </div>
                
                <input type="hidden" id="treasure-id">
                
                <div class="actions">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <button type="button" class="btn" onclick="closeModal()">Отмена</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        const CONFIG = {
            SUPABASE_URL: 'https://otvtqoowhupqxushkmma.supabase.co',
            SUPABASE_KEY: 'sb_publishable_yeG_VzvaJW-0Pxikgrup7g_cYZXKLfn'
        };
        
        let supabase;
        let treasures = [];
        
        document.addEventListener('DOMContentLoaded', async () => {
            supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
            await loadData();
        });
        
        async function loadData() {
            await loadStats();
            await loadTreasures();
            await loadUsers();
        }
        
        async function loadStats() {
            try {
                const { data: allTreasures } = await supabase.from('treasures').select('*');
                const { data: activeTreasures } = await supabase.from('treasures').select('*').eq('active', true);
                const { data: users } = await supabase.from('users').select('*');
                const { data: claims } = await supabase.from('claims').select('*');
                
                document.getElementById('total-treasures').textContent = allTreasures?.length || 0;
                document.getElementById('active-treasures').textContent = activeTreasures?.length || 0;
                document.getElementById('total-users').textContent = users?.length || 0;
                document.getElementById('total-claims').textContent = claims?.length || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        async function loadTreasures() {
            try {
                document.getElementById('treasures-loading').style.display = 'block';
                document.getElementById('treasures-table').style.display = 'none';
                
                const { data } = await supabase
                    .from('treasures')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                treasures = data || [];
                
                const html = treasures.map(t => `
                    <tr>
                        <td class="icon">${t.icon || '💎'}</td>
                        <td>${t.name}</td>
                        <td>${t.category || '-'}</td>
                        <td>${t.points}</td>
                        <td class="${t.active ? 'status-active' : 'status-inactive'}">
                            ${t.active ? '✓ Активна' : '✗ Неактивна'}
                        </td>
                        <td>${t.description ? '✓' : '✗'}</td>
                        <td>${t.image_url ? '✓' : '✗'}</td>
                        <td class="actions">
                            <button class="btn btn-primary" onclick="editTreasure(${t.id})">
                                Изменить
                            </button>
                            <button class="btn btn-danger" onclick="deleteTreasure(${t.id})">
                                Удалить
                            </button>
                        </td>
                    </tr>
                `).join('');
                
                document.getElementById('treasures-list').innerHTML = html;
                document.getElementById('treasures-loading').style.display = 'none';
                document.getElementById('treasures-table').style.display = 'table';
                
            } catch (error) {
                console.error('Error loading treasures:', error);
                document.getElementById('treasures-loading').textContent = 'Ошибка загрузки';
            }
        }
        
        async function loadUsers() {
            try {
                document.getElementById('users-loading').style.display = 'block';
                document.getElementById('users-table').style.display = 'none';
                
                const { data: users } = await supabase
                    .from('users')
                    .select('*')
                    .order('score', { ascending: false })
                    .limit(10);
                
                const { data: claims } = await supabase
                    .from('claims')
                    .select('user_id');
                
                const claimCounts = claims ? claims.reduce((acc, c) => {
                    acc[c.user_id] = (acc[c.user_id] || 0) + 1;
                    return acc;
                }, {}) : {};
                
                const html = users.map((u, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td>@${u.username}</td>
                        <td>${u.score}</td>
                        <td>${claimCounts[u.id] || 0}</td>
                    </tr>
                `).join('');
                
                document.getElementById('users-list').innerHTML = html;
                document.getElementById('users-loading').style.display = 'none';
                document.getElementById('users-table').style.display = 'table';
                
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }
        
        function showAddModal() {
            document.getElementById('modal-title').textContent = 'Добавить точку';
            document.getElementById('treasure-form').reset();
            document.getElementById('treasure-id').value = '';
            document.getElementById('edit-modal').style.display = 'flex';
        }
        
        function editTreasure(id) {
            const treasure = treasures.find(t => t.id === id);
            if (!treasure) return;
            
            document.getElementById('modal-title').textContent = 'Редактировать точку';
            document.getElementById('treasure-id').value = treasure.id;
            document.getElementById('name').value = treasure.name;
            document.getElementById('icon').value = treasure.icon || '';
            document.getElementById('legend').value = treasure.legend || '';
            document.getElementById('description').value = treasure.description || '';
            document.getElementById('image_url').value = treasure.image_url || '';
            document.getElementById('category').value = treasure.category || 'history';
            document.getElementById('lat').value = treasure.lat;
            document.getElementById('lng').value = treasure.lng;
            document.getElementById('points').value = treasure.points;
            document.getElementById('active').checked = treasure.active;
            
            document.getElementById('edit-modal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }
        
        async function saveTreasure(event) {
            event.preventDefault();
            
            const id = document.getElementById('treasure-id').value;
            const data = {
                name: document.getElementById('name').value,
                icon: document.getElementById('icon').value,
                legend: document.getElementById('legend').value,
                description: document.getElementById('description').value,
                image_url: document.getElementById('image_url').value,
                category: document.getElementById('category').value,
                lat: parseFloat(document.getElementById('lat').value),
                lng: parseFloat(document.getElementById('lng').value),
                points: parseInt(document.getElementById('points').value),
                active: document.getElementById('active').checked
            };
            
            try {
                if (id) {
                    await supabase.from('treasures').update(data).eq('id', id);
                    alert('Точка обновлена!');
                } else {
                    await supabase.from('treasures').insert([data]);
                    alert('Точка добавлена!');
                }
                
                closeModal();
                await loadData();
                
            } catch (error) {
                console.error('Error saving treasure:', error);
                alert('Ошибка при сохранении');
            }
        }
        
        async function deleteTreasure(id) {
            if (!confirm('Удалить эту точку?')) return;
            
            try {
                await supabase.from('treasures').delete().eq('id', id);
                alert('Точка удалена!');
                await loadData();
            } catch (error) {
                console.error('Error deleting treasure:', error);
                alert('Ошибка при удалении');
            }
        }
    </script>
</body>
</html>
